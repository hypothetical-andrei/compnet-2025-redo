services:
  ftp:
    build: ./ftp
    volumes:
      - ./data:/data
    networks:
      net_server:
        ipv4_address: 172.31.0.10

  natfw:
    image: debian:stable-slim
    privileged: true
    volumes:
      - ./natfw:/natfw:ro
    command: ["bash", "/natfw/setup.sh"]
    networks:
      net_client:
        ipv4_address: 172.30.0.2
      net_server:
        ipv4_address: 172.31.0.2

  client:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./client:/app:ro
    depends_on:
      - natfw
      - ftp
    environment:
      FTP_HOST: ftp-server
      FTP_PORT: "2121"
    extra_hosts:
      - "ftp-server:172.31.0.10"
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update
      && apt-get install -y --no-install-recommends iproute2 iputils-ping
      && ip route replace 172.31.0.0/24 via 172.30.0.2
      && python ftp_client.py"
    networks:
      net_client:
        ipv4_address: 172.30.0.10

networks:
  net_client:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  net_server:
    ipam:
      config:
        - subnet: 172.31.0.0/24
