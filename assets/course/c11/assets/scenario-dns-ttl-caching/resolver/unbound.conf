server:
  interface: 0.0.0.0
  access-control: 172.28.0.0/24 allow
  verbosity: 2

  # .test is treated specially by Unbound, so disable the default local handling.
  local-zone: "test." nodefault

  # This is a private, unsigned teaching zone.
  # Without this, DNSSEC validation may produce SERVFAIL.
  domain-insecure: "example.test."

forward-zone:
  name: "example.test."
  forward-addr: 172.28.0.10@53