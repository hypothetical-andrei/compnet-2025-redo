<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bellman-Ford Visualizer</title>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #fff; color: #111; }
  svg { width: 100%; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
  .controls { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { cursor: pointer; padding: 4px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 13px; }
  button:hover { background: #f0f0f0; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { padding: 4px 10px; border: 1px solid #ddd; text-align: center; }
  th { color: #666; font-weight: 500; }
  .updated { background: #EAF3DE; color: #27500A; font-weight: 500; }
  #bf-action { font-size: 13px; color: #555; margin-top: 8px; min-height: 18px; }
  #bf-step-label { font-size: 13px; color: #888; }
</style>
</head>
<body>

<h2 style="font-size:18px;font-weight:500;margin:0 0 4px;">Bellman-Ford step visualizer</h2>
<p style="font-size:13px;color:#555;margin:0 0 1rem;">Source: D — iterates over all edges |V|-1 times</p>

<svg id="bf-svg" viewBox="0 0 500 260"></svg>

<div class="controls">
  <button id="bf-prev">← prev</button>
  <button id="bf-next">next →</button>
  <button id="bf-reset">reset</button>
  <span id="bf-step-label"></span>
</div>

<div style="font-size:12px;color:#888;margin-bottom:4px;">Distances from D</div>
<table id="bf-dist-table"></table>
<div id="bf-action"></div>

<script>
(function () {
  const graph = {
    A: { B: 4, C: 2 },
    B: { D: 2, E: 3, A: 4 },
    C: { D: 3, E: 1, A: 2 },
    D: { C: 3, B: 2 },
    E: { B: 3, C: 1 }
  };
  const source = "D";
  const nodes = Object.keys(graph);
  const positions = {
    A: { x: 250, y: 40 },
    B: { x: 430, y: 130 },
    C: { x: 70,  y: 130 },
    D: { x: 250, y: 220 },
    E: { x: 160, y: 130 }
  };

  function buildSteps() {
    let dist = {}; nodes.forEach(v => dist[v] = Infinity); dist[source] = 0;
    let pred = {}; nodes.forEach(v => pred[v] = null);
    let steps = [{ dist: { ...dist }, pred: { ...pred }, active: null, msg: "Initial state — all distances ∞ except source D = 0", updated: [] }];
    for (let i = 0; i < nodes.length - 1; i++) {
      let changed = false;
      for (let u of nodes) {
        for (let [v, w] of Object.entries(graph[u])) {
          let nd = dist[u] + w;
          if (dist[u] !== Infinity && nd < dist[v]) {
            dist[v] = nd; pred[v] = u; changed = true;
            steps.push({ dist: { ...dist }, pred: { ...pred }, active: [u, v], msg: `Iter ${i + 1}: relax ${u}→${v} (w=${w}): ${v} updated to ${nd}`, updated: [v] });
          } else {
            steps.push({ dist: { ...dist }, pred: { ...pred }, active: [u, v], msg: `Iter ${i + 1}: check ${u}→${v} (w=${w}): no improvement`, updated: [] });
          }
        }
      }
      if (!changed) break;
    }
    steps.push({ dist: { ...dist }, pred: { ...pred }, active: null, msg: "Done — shortest paths found", updated: [] });
    return steps;
  }

  const steps = buildSteps();
  let cur = 0;
  const svg = document.getElementById('bf-svg');

  function draw(step) {
    svg.innerHTML = '';
    const s = steps[step];
    const ae = s.active;

    // defs / arrowheads
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    function makeMarker(id, color) {
      const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
      m.setAttribute('id', id); m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7');
      m.setAttribute('refX', '6'); m.setAttribute('refY', '3'); m.setAttribute('orient', 'auto');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M0,0 L0,6 L7,3 z'); p.setAttribute('fill', color); m.appendChild(p);
      return m;
    }
    defs.appendChild(makeMarker('arr', '#aaa'));
    defs.appendChild(makeMarker('arrg', '#1D9E75'));
    svg.appendChild(defs);

    // edges
    for (let u of nodes) {
      for (let [v, w] of Object.entries(graph[u])) {
        const p1 = positions[u], p2 = positions[v];
        const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.sqrt(dx * dx + dy * dy);
        const r = 18;
        const sx = p1.x + dx / len * r, sy = p1.y + dy / len * r;
        const ex = p2.x - dx / len * (r + 8), ey = p2.y - dy / len * (r + 8);
        const isActive = ae && ae[0] === u && ae[1] === v;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', sx); line.setAttribute('y1', sy);
        line.setAttribute('x2', ex); line.setAttribute('y2', ey);
        line.setAttribute('stroke', isActive ? '#1D9E75' : '#ccc');
        line.setAttribute('stroke-width', isActive ? '2.5' : '1.2');
        line.setAttribute('marker-end', 'url(#' + (isActive ? 'arrg' : 'arr') + ')');
        svg.appendChild(line);
        const mx = (p1.x + p2.x) / 2 + (dy / len) * 12, my = (p1.y + p2.y) / 2 - (dx / len) * 12;
        const wt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        wt.setAttribute('x', mx); wt.setAttribute('y', my);
        wt.setAttribute('text-anchor', 'middle'); wt.setAttribute('font-size', '11');
        wt.setAttribute('fill', isActive ? '#0F6E56' : '#999');
        wt.textContent = w; svg.appendChild(wt);
      }
    }

    // nodes
    for (let v of nodes) {
      const p = positions[v];
      const isUpdated = s.updated.includes(v);
      const isSource = v === source;
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', 18);
      circle.setAttribute('fill', isSource ? '#B5D4F4' : isUpdated ? '#C0DD97' : '#fff');
      circle.setAttribute('stroke', isSource ? '#185FA5' : isUpdated ? '#3B6D11' : '#aaa');
      circle.setAttribute('stroke-width', '1.5');
      svg.appendChild(circle);

      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', p.x); lbl.setAttribute('y', p.y + 1);
      lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('dominant-baseline', 'middle');
      lbl.setAttribute('font-size', '13'); lbl.setAttribute('font-weight', '500');
      lbl.setAttribute('fill', isSource ? '#0C447C' : isUpdated ? '#27500A' : '#111');
      lbl.textContent = v; svg.appendChild(lbl);

      const d = s.dist[v];
      const dlbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      dlbl.setAttribute('x', p.x); dlbl.setAttribute('y', p.y + 30);
      dlbl.setAttribute('text-anchor', 'middle'); dlbl.setAttribute('font-size', '11');
      dlbl.setAttribute('fill', d === Infinity ? '#ccc' : '#1D9E75');
      dlbl.textContent = d === Infinity ? '∞' : d; svg.appendChild(dlbl);
    }
  }

  function renderTable(step) {
    const s = steps[step];
    const t = document.getElementById('bf-dist-table');
    t.innerHTML =
      '<tr>' + nodes.map(v => `<th>${v}</th>`).join('') + '</tr>' +
      '<tr>' + nodes.map(v => {
        const d = s.dist[v];
        return `<td class="${s.updated.includes(v) ? 'updated' : ''}">${d === Infinity ? '∞' : d}</td>`;
      }).join('') + '</tr>';
    document.getElementById('bf-action').textContent = s.msg;
    document.getElementById('bf-step-label').textContent = `Step ${step} / ${steps.length - 1}`;
  }

  function render() { draw(cur); renderTable(cur); }

  document.getElementById('bf-next').onclick = () => { if (cur < steps.length - 1) { cur++; render(); } };
  document.getElementById('bf-prev').onclick = () => { if (cur > 0) { cur--; render(); } };
  document.getElementById('bf-reset').onclick = () => { cur = 0; render(); };

  render();
})();
</script>
</body>
</html>
