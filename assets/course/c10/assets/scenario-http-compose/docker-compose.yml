services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build: ./web
    expose:
      - "8000"
    restart: unless-stopped

  api:
    build: ./api
    expose:
      - "5000"
    restart: unless-stopped