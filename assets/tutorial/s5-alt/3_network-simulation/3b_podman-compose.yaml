# 3b_podman-compose.yaml
#
# Topologie Podman Compose pentru disciplina Rețele de Calculatoare
# h1 ---- r1 ---- h2
#
# Utilizare:
#   podman compose -f 3b_podman-compose.yaml up -d
#   podman exec -it h1 bash
#   podman exec -it r1 bash
#   podman exec -it h2 bash
#   podman compose -f 3b_podman-compose.yaml down

networks:

  # Subnet A: legătura h1 — r1  (10.0.1.0/24)
  net_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24

  # Subnet B: legătura h2 — r1  (10.0.2.0/24)
  net_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24

services:

  # ------------------------------------------------------------------ h1
  h1:
    image: nicolaka/netshoot
    container_name: h1
    hostname: h1
    command: ["sleep", "infinity"]
    networks:
      net_a:
        ipv4_address: 10.0.1.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      # FIX: format KEY=VALUE (nu YAML key: value)
      - net.ipv4.ip_forward=0

  # ------------------------------------------------------------------ h2
  h2:
    image: nicolaka/netshoot
    container_name: h2
    hostname: h2
    command: ["sleep", "infinity"]
    networks:
      net_b:
        ipv4_address: 10.0.2.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=0

  # ------------------------------------------------------------------ r1
  # FIX: Podman nu permite ipv4_address pe containere conectate la mai multe
  # rețele simultan. r1 primește adrese automat din fiecare subnet (prima
  # adresă disponibilă după gateway, de obicei .1 sau .2).
  # Verificați adresele reale cu: podman exec -it r1 ip a
  r1:
    image: nicolaka/netshoot
    container_name: r1
    hostname: r1
    command: ["sleep", "infinity"]
    networks:
      - net_a
      - net_b
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
