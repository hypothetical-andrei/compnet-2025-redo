services:
  web1:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - ./web1:/app:ro
    command: ["python", "-m", "http.server", "8000"]
    expose:
      - "8000"

  web2:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - ./web2:/app:ro
    command: ["python", "-m", "http.server", "8000"]
    expose:
      - "8000"

  web3:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - ./web3:/app:ro
    command: ["python", "-m", "http.server", "8000"]
    expose:
      - "8000"

  lb-custom:
    build:
      context: .
      dockerfile: Dockerfile.lb
    volumes:
      - ./simple_lb.py:/app/simple_lb.py:ro
    ports:
      - "8080:8080"
    depends_on:
      - web1
      - web2
      - web3