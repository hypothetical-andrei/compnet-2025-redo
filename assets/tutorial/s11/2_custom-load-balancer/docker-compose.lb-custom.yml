
version: '3.9'

services:
  web1:
    image: python:3.11-alpine
    container_name: web1
    working_dir: /app
    volumes:
      - ./web1:/app
    command: ["python3", "-m", "http.server", "8000"]
    expose:
      - "8000"

  web2:
    image: python:3.11-alpine
    container_name: web2
    working_dir: /app
    volumes:
      - ./web2:/app
    command: ["python3", "-m", "http.server", "8000"]
    expose:
      - "8000"

  web3:
    image: python:3.11-alpine
    container_name: web3
    working_dir: /app
    volumes:
      - ./web3:/app
    command: ["python3", "-m", "http.server", "8000"]
    expose:
      - "8000"

  lb-custom:
    build:
      context: .
      dockerfile: Dockerfile.lb
    container_name: lb-custom
    ports:
      - "8080:8080"
    depends_on:
      - web1
      - web2
      - web3

networks:
  default:
    name: lbnet
