services:
  web:
    image: nginx:alpine

  db:
    image: redis:7-alpine

  dns-server:
    build: .
    expose:
      - "5353/udp"

  debug:
    image: alpine:latest
    command: sh -c "apk add --no-cache bind-tools iputils && sleep infinity"
    depends_on:
      - web
      - db
      - dns-server